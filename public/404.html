<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Zarewa ERP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f4f6f5 0%, #e8eae8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      text-align: center;
      background: white;
      border-radius: 16px;
      padding: 60px 40px;
      box-shadow: 0 20px 60px rgba(19, 78, 74, 0.1);
    }

    .error-code {
      font-size: 96px;
      font-weight: 900;
      background: linear-gradient(135deg, #134e4a 0%, #0d3a37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      color: #1e293b;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      font-size: 14px;
    }

    .btn-primary {
      background: #134e4a;
      color: white;
    }

    .btn-primary:hover {
      background: #0d3a37;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(19, 78, 74, 0.2);
    }

    .btn-secondary {
      background: #f1f5f4;
      color: #134e4a;
    }

    .btn-secondary:hover {
      background: #e8eae8;
    }

    .footer {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #e2e8f0;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Please check the URL and try again, or return to the Zarewa application.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Go to Zarewa Home</a>
      <a href="javascript:history.back()" class="btn-secondary">Go Back</a>
    </div>
    <div class="footer">
      <p>If you believe this is an error, please contact your system administrator.</p>
      <p>© 2024 Zarewa ERP. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
